openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: problems
    description: Built-in competitive programming problems
  - name: judge
    description: C++ compilation and judging
  - name: trace
    description: GDB execution traces
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /problems:
    get:
      operationId: listProblems
      tags: [problems]
      summary: List built-in problems
      responses:
        "200":
          description: Built-in problems
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Problem"
  /problems/{problemId}:
    get:
      operationId: getProblem
      tags: [problems]
      summary: Get a built-in problem
      parameters:
        - name: problemId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Problem details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: Problem not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /submissions:
    post:
      operationId: createSubmission
      tags: [judge]
      summary: Compile and judge C++ code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmissionInput"
      responses:
        "200":
          description: >
            Judge result. The verdict field is one of AC, WA, TLE, RE, or CE.
            A compile failure is a normal 200 with verdict "CE" (and a populated
            compileError) — it is NOT an HTTP error and must not be turned into a 500.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmissionResult"
        "400":
          description: Invalid request payload (request validation failed)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Problem not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: Request payload too large
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Too many requests (sandbox capacity exceeded)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Sandbox (Docker) unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /trace:
    post:
      operationId: createTrace
      tags: [trace]
      summary: Run C++ code and capture a debugger trace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TraceInput"
      responses:
        "200":
          description: Execution trace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TraceResult"
        "400":
          description: Invalid request payload (request validation failed)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: Request payload too large
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Too many requests (sandbox capacity exceeded)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Sandbox (Docker) unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /trace/{traceId}:
    get:
      operationId: getTrace
      tags: [trace]
      summary: Get a saved execution trace
      parameters:
        - name: traceId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Execution trace details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TraceResult"
        "404":
          description: Trace not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ErrorResponse:
      type: object
      description: >
        Consistent error envelope returned for all non-2xx responses. The error
        field is always a safe, client-facing summary; internal details (stack
        traces, file paths) are logged server-side only and never leaked here.
      properties:
        error:
          type: string
          description: Human-readable summary of the failure.
        details:
          type: array
          description: Optional structured detail, e.g. per-field validation issues.
          items:
            type: object
            properties:
              path:
                type: string
                description: Dot-path of the offending field, when applicable.
              message:
                type: string
                description: Description of the issue for this entry.
            required:
              - message
      required:
        - error
    ProblemTestCase:
      type: object
      properties:
        id: { type: string }
        input: { type: string }
        expectedOutput: { type: string }
      required: [id, input, expectedOutput]
    Problem:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        difficulty:
          type: string
          enum: [Easy, Medium, Hard]
        description: { type: string }
        starterCode: { type: string }
        testCases:
          type: array
          items: { $ref: "#/components/schemas/ProblemTestCase" }
      required: [id, title, difficulty, description, starterCode, testCases]
    SubmissionInput:
      type: object
      properties:
        code: { type: string, minLength: 1 }
        problemId: { type: string, minLength: 1 }
      required: [code, problemId]
    TestCaseResult:
      type: object
      properties:
        id: { type: string }
        verdict: { type: string }
        actualOutput: { type: string }
        expectedOutput: { type: string }
        runtimeMs: { type: number }
        error: { type: ["string", "null"] }
      required: [id, verdict, actualOutput, expectedOutput, runtimeMs, error]
    SubmissionResult:
      type: object
      properties:
        verdict: { type: string }
        totalRuntimeMs: { type: number }
        tests:
          type: array
          items: { $ref: "#/components/schemas/TestCaseResult" }
        compileError: { type: ["string", "null"] }
      required: [verdict, totalRuntimeMs, tests, compileError]
    TraceInput:
      type: object
      properties:
        code: { type: string, minLength: 1 }
        input: { type: string }
        problemId: { type: string }
      required: [code, input]
    TraceLocal:
      type: object
      properties:
        name: { type: string }
        type: { type: string }
        value: { type: string }
      required: [name, type, value]
    TraceFrame:
      type: object
      properties:
        function: { type: string }
        line: { type: number }
      required: [function, line]
    TraceArray:
      type: object
      properties:
        name: { type: string }
        type: { type: string }
        values:
          type: array
          items: { type: string }
        indexable:
          type: boolean
          description: >
            True when the container is indexed by an integer offset that the user
            can subscript (vector, C-array, string). False for map/set/stack/queue
            where the numeric position above each cell would be misleading.
      required: [name, type, values, indexable]
    TraceStep:
      type: object
      properties:
        step: { type: number }
        line: { type: number }
        function: { type: string }
        locals:
          type: array
          items: { $ref: "#/components/schemas/TraceLocal" }
        stack:
          type: array
          items: { $ref: "#/components/schemas/TraceFrame" }
        arrays:
          type: array
          items: { $ref: "#/components/schemas/TraceArray" }
        highlights:
          type: array
          items:
            type: object
            properties:
              array: { type: string }
              index: { type: number }
              expr: { type: string }
            required: [array, index, expr]
      required: [step, line, function, locals, stack, arrays]
    TraceResult:
      type: object
      properties:
        id: { type: string }
        trace:
          type: array
          items: { $ref: "#/components/schemas/TraceStep" }
        source: { type: string }
        truncated: { type: boolean }
        error: { type: ["string", "null"] }
        problemId: { type: ["string", "null"] }
        problemName: { type: ["string", "null"] }
        createdAt: { type: string }
      required: [id, trace, source, truncated, error, problemId, problemName]

